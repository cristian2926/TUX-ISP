services:
  # ── Base de datos ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: tuxtell_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tuxtell_isp
      POSTGRES_USER: tuxtell
      POSTGRES_PASSWORD: Tuxtell2026#Secure
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # solo localhost — backend host lo accede directamente
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuxtell -d tuxtell_isp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend FastAPI ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tuxtell_backend
    restart: unless-stopped
    network_mode: host          # comparte red del host → accede a wg0 (10.10.0.x) y localhost:5432
    cap_add:
      - NET_ADMIN               # necesario para wg set / wg show
    environment:
      DATABASE_URL: postgresql://tuxtell:Tuxtell2026#Secure@127.0.0.1:5432/tuxtell_isp
      SECRET_KEY: "tuxtell2026secretkey#ISP$$secure"
      WHATSAPP_API_URL: http://127.0.0.1:3001
      SSH_KEY_PATH: /root/.ssh/tuxtell_key
      SSH_USER: tuxtell-api
      WG_CONFIG_PATH: /etc/wireguard/wg0.conf
      VPS_WG_PUBKEY: z5ErxfupttwgB5L0AA2C+AzRAFwy4N1ZCVvKGRyV5TI=
      VPS_IP: "161.132.48.127"
    volumes:
      - ./backend:/app
      - /root/.ssh:/root/.ssh:ro              # llave SSH para MikroTik
      - /etc/wireguard:/etc/wireguard:rw      # gestión WireGuard
      - /opt/tuxtell-isp/backups:/backups     # backups PostgreSQL
    depends_on:
      postgres:
        condition: service_healthy

  # ── WhatsApp ──────────────────────────────────────────────────────────────────
  whatsapp:
    build:
      context: ./whatsapp
      dockerfile: Dockerfile
    container_name: tuxtell_whatsapp
    restart: unless-stopped
    network_mode: host          # accesible en 127.0.0.1:3001 desde el backend
    mem_limit: 700m
    memswap_limit: 700m
    volumes:
      - whatsapp_session:/app/.wwebjs_auth
    environment:
      PORT: "3001"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium

  # ── Frontend React ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tuxtell_frontend
    restart: unless-stopped
    ports:
      - "3000:80"

  # ── Nginx reverse-proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: tuxtell_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # resuelve al host → backend puerto 8000
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend

volumes:
  postgres_data:
  whatsapp_session:
